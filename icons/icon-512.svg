<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004d40" />
      <stop offset="50%" stop-color="#00897b" />
      <stop offset="100%" stop-color="#26a69a" />
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#80cbc4" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Clean sparkling bubbles -->
  <circle cx="120" cy="140" r="28" fill="url(#bubbleGrad)" />
  <circle cx="390" cy="180" r="38" fill="url(#bubbleGrad)" />
  <circle cx="140" cy="380" r="20" fill="url(#bubbleGrad)" />
  <circle cx="370" cy="360" r="24" fill="url(#bubbleGrad)" />

  <!-- Main Clean Spray / Hygiene Droplet Shape -->
  <g filter="url(#shadow)">
    <!-- Droplet / Sparkle combination -->
    <path d="M256 80 C256 80 140 230 140 330 C140 396 192 440 256 440 C320 440 372 396 372 330 C372 230 256 80 256 80 Z" fill="#ffffff" />
    
    <!-- Inner Sparkle / Sparkle core -->
    <path d="M256 160 C256 220 200 270 200 330 C200 365 225 395 256 395 C287 395 312 365 312 330 C312 270 256 160 256 160 Z" fill="#00897b" />
    
    <!-- Sparkle star 4-point -->
    <path d="M256 270 Q256 300 286 300 Q256 300 256 330 Q256 300 226 300 Q256 300 256 270 Z" fill="#ffffff" />
  </g>

  <!-- Sparkle stars -->
  <path d="M370 120 Q370 135 385 135 Q370 135 370 150 Q370 135 355 135 Q370 135 370 120 Z" fill="#ffca28" />
  <path d="M120 250 Q120 262 132 262 Q120 262 120 274 Q120 262 108 262 Q120 262 120 250 Z" fill="#ffca28" />
</svg>
