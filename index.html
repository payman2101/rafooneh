<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه رفونه</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>فروشگاه اینترنتی رفونه</h1>
    <div class="cart-icon" onclick="openCart()">
        🛒 سبد خرید (<span id="cart-count">0</span>)
    </div>
</header>

<div class="container">
    <div id="products-container" class="products-grid">
        <!-- محصولات اینجا بارگذاری می‌شوند -->
    </div>
</div>

<!-- مودال سبد خرید -->
<div id="cartModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" id="cartModalClose">&times;</span>
        <h2>سبد خرید</h2>
        <div id="cart-items"></div>
        <div id="cart-total" style="margin-top: 1rem; font-weight: bold;"></div>
        <button id="checkoutBtn" class="checkout-btn">تأیید و پرداخت</button>
    </div>
</div>

<!-- مودال پرداخت -->
<div id="paymentModal" class="modal">
    <div class="modal-content payment-modal">
        <span class="close-btn" id="paymentModalClose">&times;</span>
        <h2>اطلاعات ارسال و پرداخت</h2>
        <div class="payment-form">
            <input type="text" id="customerName" placeholder="نام و نام خانوادگی">
            <textarea id="customerAddress" rows="3" placeholder="آدرس دقیق پستی"></textarea>
            <p style="font-size: 0.9rem; color: #666;">پس از کلیک بر روی دکمه زیر، به درگاه پرداخت هدایت می‌شوید (شبیه‌سازی) و سفارش به واتساپ ارسال می‌گردد.</p>
            <button id="confirmPaymentBtn" class="checkout-btn">پرداخت آنلاین</button>
        </div>
    </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>

</body>
</html>
